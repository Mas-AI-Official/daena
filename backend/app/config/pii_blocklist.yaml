# PII Blocklist — public regex pack
# Phase 1 F6 (2026-04-24). Loaded by app/services/pii_guard.py.
#
# Schema:
#   regex:
#     - name: <stable identifier used in audit logs>
#       pattern: <Python re pattern>
#       severity: block | redact
#
# block   = SecurityGate halts the request entirely
# redact  = matched span replaced with <NAME> token before send
#
# Founder-private EXACT-STRING blocks (real address, bank acct, etc.)
# live OUTSIDE this file at:
#   D:\Ideas\Daena-Mind\soul\T4-founder-private\pii_blocklist_values.yaml
# Per CLAUDE.md rule 15 that vault is gitignored. NEVER put real values
# here -- this file is committed.

regex:
  # ── Financial: payment cards ───────────────────────────────────
  - name: credit_card_visa
    pattern: '\b4\d{3}[ -]?\d{4}[ -]?\d{4}[ -]?\d{4}\b'
    severity: block

  - name: credit_card_mastercard
    pattern: '\b5[1-5]\d{2}[ -]?\d{4}[ -]?\d{4}[ -]?\d{4}\b'
    severity: block

  - name: credit_card_amex
    pattern: '\b3[47]\d{2}[ -]?\d{6}[ -]?\d{5}\b'
    severity: block

  - name: credit_card_discover
    pattern: '\b6(?:011|5\d{2})[ -]?\d{4}[ -]?\d{4}[ -]?\d{4}\b'
    severity: block

  # ── Financial: bank accounts + IBAN ──────────────────────────
  - name: iban
    pattern: '\b[A-Z]{2}\d{2}[A-Z0-9]{10,30}\b'
    severity: block

  - name: us_bank_routing_account
    pattern: '\b\d{9}[ \-/]\d{4,17}\b'
    severity: block

  # ── Government IDs ───────────────────────────────────────────
  - name: us_ssn
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
    severity: block

  - name: ca_sin
    pattern: '\b\d{3}[ -]\d{3}[ -]\d{3}\b'
    severity: block

  - name: us_passport
    pattern: '\b[A-Z]\d{8}\b'
    severity: block

  - name: ca_drivers_license_on
    # Ontario format: A1234-12345-12345
    pattern: '\b[A-Z]\d{4}-\d{5}-\d{5}\b'
    severity: block

  # ── Generic PII (redact, don't block) ───────────────────────
  - name: email
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    severity: redact

  - name: phone_na
    pattern: '(?:\+?1[ \-.])?\(?\d{3}\)?[ \-.]\d{3}[ \-.]\d{4}\b'
    severity: redact

  - name: ipv4
    pattern: '\b(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){3}\b'
    severity: redact

  # ── Auth secrets (block — must never leave Daena) ────────────
  - name: anthropic_api_key
    pattern: 'sk-ant-[A-Za-z0-9_\-]{20,}'
    severity: block

  - name: openai_api_key
    pattern: 'sk-[A-Za-z0-9_\-]{20,}'
    severity: block

  - name: groq_api_key
    pattern: 'gsk_[A-Za-z0-9_\-]{20,}'
    severity: block

  - name: perplexity_api_key
    pattern: 'pplx-[A-Za-z0-9_\-]{20,}'
    severity: block

  - name: gemini_api_key
    pattern: 'AIza[A-Za-z0-9_\-]{20,}'
    severity: block

  - name: github_token
    pattern: 'gh[ps]_[A-Za-z0-9]{30,}'
    severity: block

  - name: aws_access_key
    pattern: 'AKIA[0-9A-Z]{16}'
    severity: block

  - name: jwt_token
    pattern: 'eyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+'
    severity: block
