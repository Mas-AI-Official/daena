[project]
name = "daena-backend"
version = "0.1.0"
description = "Daena — Governed Multi-Agent LLM Orchestration Platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "Masoud Masoori", email = "masoud@mas-ai.ca"}
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # Cache & Queue
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",

    # Auth & Security
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",

    # Validation & Settings
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",

    # HTTP clients (for LLM providers)
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",

    # Logging
    "structlog>=24.4.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",

    # Agent capabilities
    "browser-use>=0.12.0",
    "crawl4ai>=0.8.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",    # Depends() in defaults is standard FastAPI pattern
    "UP042",   # str+Enum is fine, StrEnum has subtle behavior differences
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Bandit: static security analyzer config ──
#
# Offensive security scanner modules deliberately disable SSL verification
# when probing targets (self-signed certs, expired certs, misconfigured
# hosts are exactly the signals a pen-tester wants to capture). Excluding
# B501 in those directories silences the false positives without
# weakening the gate for the rest of the codebase.
#
# ``create_tool`` uses ``exec()`` on LLM-generated Python by design -- this
# is the high-blast-radius capability now gated via ``permission_resolver``
# CRITICAL classification (see ``tool_call_classifier._CODE_EXEC_TOOLS``).
# B102 is intentional there and governed, not suppressed.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv_daena"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
