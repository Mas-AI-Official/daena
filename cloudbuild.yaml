steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/daena-repo/daena:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/daena-repo/daena:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/daena-repo/daena:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/daena-repo/daena:latest'

  # Deploy the new image AND bind Secret Manager secrets + Cloud SQL
  # in one atomic revision. This avoids the half-baked state where the
  # new image runs against the old plaintext env, or the new env binds
  # to the old image's unguarded Base.metadata.create_all.
  #
  # Schema migrations run inside the container at start via
  # /app/start.sh -> `alembic upgrade head`. See Dockerfile ENTRYPOINT.
  #
  # --service-account on the deploy step pins the RUNTIME SA (daena-run).
  # The BUILD SA (daena-build) is set via the top-level serviceAccount
  # field below. Two distinct SAs by design: build vs runtime separation.
  # Deploys to a FRESH service `daena-v2` (the prior `daena` service has
  # 4 broken revisions stuck on a 2026-04-08 image; left alone for autopsy).
  # Fresh service has no plaintext env to remove (so no --remove-env-vars
  # needed). All secrets bound directly via --update-secrets.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'daena-v2'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/daena-repo/daena:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--service-account=daena-run@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:daena-db'
      - '--update-secrets=DATABASE_URL=daena-database-url:latest,DAENA_KEK=daena-daena-kek:latest,JWT_SECRET_KEY=daena-jwt-secret-key:latest,VAULT_ENCRYPTION_KEY=daena-vault-encryption-key:latest,GROQ_API_KEY=daena-groq-api-key:latest,GEMINI_API_KEY=daena-gemini-api-key:latest,GOOGLE_CLIENT_SECRET=daena-google-client-secret:latest,GITHUB_CLIENT_SECRET=daena-github-client-secret:latest'
      # CORS_ORIGINS is a JSON array; commas inside it would collide with
      # gcloud's default --update-env-vars separator. The `^@^` prefix
      # tells gcloud to use `@` as the KEY=VALUE separator instead, so
      # the JSON value passes through unmodified. Pydantic's CORS_ORIGINS
      # validator (backend/app/core/config.py:225) accepts both JSON
      # array and comma-separated string forms; we use JSON here for
      # clarity. Production guardrail at backend/app/main.py:758 refuses
      # to start the app if this is left at the localhost-only default.
      - '--update-env-vars=^@^APP_ENV=production@LOG_LEVEL=info@USE_CONNECTION_REGISTRY_V2=false@DISABLE_AUTH=false@CORS_ORIGINS=["https://daena.mas-ai.co","https://mas-ai.co","http://localhost:5173"]'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/daena-repo/daena:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/daena-repo/daena:latest'

# Build SA: dedicated daena-build (created 2026-05-01, narrow roles).
# Required because the project has no compute default SA. Custom SA
# requires explicit logging destination (CLOUD_LOGGING_ONLY).
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/daena-build@$PROJECT_ID.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
