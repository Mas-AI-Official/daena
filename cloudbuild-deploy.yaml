steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/daena-467315/daena-repo/daena:latest'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/daena-467315/daena-repo/daena:latest'

timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
